name: Python Semantic Release

on:
  push:
    branches:
      - main
      - develop

jobs:
  release:
    name: Create Release and Publish
    runs-on: ubuntu-latest
    # Impede que múltiplos pushes simultâneos causem conflitos de versão no git
    concurrency: release
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Obrigatório: traz todo o histórico de tags para o cálculo da versão

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install Python Semantic Release
        run: |
          python -m pip install --upgrade pip
          pip install python-semantic-release build

      - name: Run Semantic Release
        # O GITHUB_TOKEN é injetado automaticamente pelo Actions para criar a Release na aba do repositório
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # O comando 'version' lê o pyproject.toml, altera os arquivos, faz o commit, cria a tag e o GitHub Release
          semantic-release version