name: LinceML CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  lint-and-test:
    name: Code Quality & Testing
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"] # Validando a resiliência prometida

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip' # Acelera a instalação das dependências

      - name: Install Java (Required for PySpark)
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run Ruff (Linting & Formatting Check)
        run: |
          ruff check .
          ruff format --check .

      - name: Run Unit Tests with Pytest (Coverage > 90%)
        run: |
          pytest tests/unit/

      - name: Run BDD Acceptance Tests (Behave)
        run: |
          behave tests/features/